[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
rust-version = "1.87"
repository = "https://github.com/xls/pandite"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size first: the shipped binary must stay small.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwind, not abort: decoders run inside a panic guard so a hostile file
# becomes an error instead of closing the app.
panic = "unwind"
strip = true
debug = false

# Decoders and filters are hot paths even in debug builds.
[profile.dev.package."*"]
opt-level = 2
