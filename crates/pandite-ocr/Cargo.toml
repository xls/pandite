[package]
name = "pandite-ocr"
description = "Text recognition providers for the pandite viewer: the operating system recognizer or a built-in one, fully offline."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pandite-core = { path = "../pandite-core" }

# Windows.Media.Ocr through WinRT. Threading lowers the worker's priority.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["std", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_System_Threading"] }

# macOS and Linux: the PP-OCRv6 models run on tract, a pure Rust inference
# engine compiled into the program. Windows links neither the engine nor
# the models.
[target.'cfg(not(windows))'.dependencies]
tract-onnx = { version = "0.23.10", default-features = false }

[dev-dependencies]
# Tests render text with the font the interface embeds.
fontdue = { version = "0.9.5", default-features = false, features = ["std"] }
# The built-in recognizer's unit tests run on every system, also Windows.
tract-onnx = { version = "0.23.10", default-features = false }
# Tests and the ocr_file example decode image files.
pandite-codecs = { path = "../pandite-codecs" }
# The fixture test reads the reference results.
serde_json = "1"

[lints]
workspace = true
