[package]
name = "pandite-app"
description = "The pandite image viewer application: window, event loop and the glue between the engine crates."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "pandite_app"
path = "src/lib.rs"

[[bin]]
name = "pandite"
path = "src/main.rs"

[dependencies]
pandite-core = { path = "../pandite-core" }
pandite-codecs = { path = "../pandite-codecs" }
pandite-ops = { path = "../pandite-ops" }
pandite-library = { path = "../pandite-library" }
pandite-ocr = { path = "../pandite-ocr" }
pandite-render = { path = "../pandite-render" }
pandite-ui = { path = "../pandite-ui" }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
rfd = { version = "0.17", default-features = false }
arboard = { version = "3.7", default-features = false }

# Linux needs window system backends for winit, a dialog backend for rfd
# and the Wayland clipboard protocol for arboard (X11 is its fallback). The
# rfd portal backend talks D-Bus over a Unix socket with its own small
# client and pulls in no async runtime; it falls back to zenity. Outside
# Windows, images reach the clipboard through arboard ("image-data");
# Windows uses its own clipboard functions (src/shell/native.rs).
# The trash (src/trash.rs) uses libc for the user id and the local time
# on Linux, and NSFileManager through objc2 on macOS. Windows calls
# shell32 directly. A move (src/disk.rs) renames without replacing a file
# through libc on Linux and macOS. All of these crates are in the tree
# already.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[lints]
workspace = true
