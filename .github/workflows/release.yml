# Release: build, package and publish pandite for every release target.
#
# A tag v<version> (equal to the Cargo.toml workspace version) builds:
#   Windows x64 and ARM64   portable .zip, unsigned per-user setup program
#                           (Inno Setup), Store-ready unsigned .msix, and
#                           one .msixbundle with both architectures
#   macOS                   universal .app (arm64 + x86_64) in a .dmg, signed
#                           with a Developer ID and notarized when the Apple
#                           secrets exist, else ad hoc signed
#   Linux x64               .tar.gz with desktop entry, icons, install script,
#                           and a .deb and an .rpm with the same files
# then writes SHA256SUMS.txt and publishes a GitHub release with all files.
#
# The npm installer (packaging/npm, `npx pandite`) is not part of a release.
# It finds the releases on GitHub and installs the Windows setup program,
# the macOS disk image or the Linux tarball after it checks SHA256SUMS.txt. Its
# owner publishes it to npm by hand when the installer code changes; see
# docs/building.md.
#
# A manual run on a branch is a dry run: it builds every package and keeps
# them as workflow artifacts. A manual run on a tag publishes like a push.
#
# Optional repository variables (Settings > Secrets and variables > Actions >
# Variables), copied from Partner Center, put the Store identity in the MSIX:
#   PANDITE_MSIX_IDENTITY_NAME, PANDITE_MSIX_PUBLISHER,
#   PANDITE_MSIX_PUBLISHER_DISPLAY_NAME
# Optional secrets add sideload-signed copies of the MSIX packages:
#   PANDITE_SIGNING_CERT_BASE64 (a .pfx file, base64), PANDITE_SIGNING_CERT_PASSWORD
# See docs/store-submission.md.
# Optional secrets sign the macOS app with a Developer ID and notarize it:
#   PANDITE_MACOS_CERT_BASE64 (the Developer ID Application certificate with
#   its private key as a .p12 file, base64), PANDITE_MACOS_CERT_PASSWORD,
#   PANDITE_APPLE_ID, PANDITE_APPLE_TEAM_ID, PANDITE_APPLE_APP_PASSWORD
# See docs/building.md.
# Optional secrets add the Mac App Store package as a workflow artifact:
#   PANDITE_MACOS_STORE_CERT_BASE64 (a .p12 file with the Apple Distribution
#   and the 3rd Party Mac Developer Installer certificates and their key,
#   base64), PANDITE_MACOS_STORE_CERT_PASSWORD,
#   PANDITE_MACOS_PROVISIONING_PROFILE_BASE64 (the Mac App Store profile)
# See docs/mac-app-store.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  MACOSX_DEPLOYMENT_TARGET: "11.0"

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      msix_version: ${{ steps.v.outputs.msix_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the version and check it against the tag
        id: v
        run: node packaging/version.mjs

  windows:
    name: Windows (${{ matrix.target }})
    needs: version
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      # Static C runtime: the program runs without the Visual C++ Redistributable.
      RUSTFLAGS: "-C target-feature=+crt-static"
      PANDITE_MSIX_IDENTITY_NAME: ${{ vars.PANDITE_MSIX_IDENTITY_NAME }}
      PANDITE_MSIX_PUBLISHER: ${{ vars.PANDITE_MSIX_PUBLISHER }}
      PANDITE_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.PANDITE_MSIX_PUBLISHER_DISPLAY_NAME }}
      HAS_SIGNING_CERT: ${{ secrets.PANDITE_SIGNING_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked -p pandite-app --target "$TARGET"

      - name: Third-party notices
        run: node packaging/third-party-notices.mjs

      - name: Portable zip
        shell: pwsh
        run: >-
          ./packaging/windows/build-zip.ps1
          -Exe "target/$env:TARGET/release/pandite.exe"
          -Version $env:VERSION -Target $env:TARGET -OutDir dist

      - name: MSIX (unsigned, for the Microsoft Store)
        run: |
          node packaging/windows/build-msix.mjs \
            --exe "target/$TARGET/release/pandite.exe" \
            --arch "${{ matrix.arch }}" --version "$VERSION" --out dist --require-static-crt

      - name: Sideload-signed MSIX (only when the signing secrets exist)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.PANDITE_SIGNING_CERT_BASE64 }}
          PANDITE_SIGN_PASSWORD: ${{ secrets.PANDITE_SIGNING_CERT_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/pandite-signing.pfx"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$CERT_BASE64" | base64 --decode --ignore-garbage > "$cert"
          short="${TARGET%-pc-windows-msvc}-windows"
          cp "dist/pandite-$VERSION-$short.msix" "dist/pandite-$VERSION-$short-sideload.msix"
          node packaging/windows/sign-msix.mjs --pfx "$cert" \
            --timestamp http://timestamp.digicert.com "dist/pandite-$VERSION-$short-sideload.msix"

      - name: Find Inno Setup 6, or install a pinned copy
        shell: pwsh
        env:
          # Used only when the runner image has no Inno Setup 6.
          INNO_SETUP_VERSION: "6.7.4"
          INNO_SETUP_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        run: |
          $iscc = ./packaging/windows/build-setup.ps1 -FindIscc
          if (-not $iscc) {
            $tag = 'is-' + ($env:INNO_SETUP_VERSION -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION.exe"
            $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
            Write-Output "The runner has no Inno Setup 6. Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $env:INNO_SETUP_SHA256) {
              throw "SHA-256 of $installer is $hash, expected $env:INNO_SETUP_SHA256"
            }
            $dir = Join-Path $env:RUNNER_TEMP 'inno-setup-6'
            $log = Join-Path $env:RUNNER_TEMP 'inno-setup-install.log'
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=$dir", "/LOG=$log")
            if ($p.ExitCode -ne 0) { Get-Content -LiteralPath $log; throw "the Inno Setup installer failed with exit code $($p.ExitCode)" }
            $iscc = Join-Path $dir 'ISCC.exe'
            if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe is not in $dir after the install" }
          }
          Write-Output "ISCC.exe: $iscc"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PANDITE_ISCC=$iscc"

      - name: Setup program (unsigned, per-user)
        shell: pwsh
        run: >-
          ./packaging/windows/build-setup.ps1
          -Exe "target/$env:TARGET/release/pandite.exe"
          -Version $env:VERSION -Target $env:TARGET -OutDir dist

      - name: Install and uninstall the setup program (x64 runner only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $setup = "dist/pandite-$env:VERSION-$($env:TARGET -replace '-pc-windows-msvc$', '-windows')-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'pandite-setup-test'
          $log = Join-Path $env:RUNNER_TEMP 'pandite-setup.log'
          # No file associations and no desktop shortcut on the runner.
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir",
            '/MERGETASKS=!associate,!desktopicon', "/LOG=$log")
          if ($p.ExitCode -ne 0) { Get-Content -LiteralPath $log; throw "setup failed with exit code $($p.ExitCode)" }
          foreach ($file in 'pandite.exe', 'LICENSE.txt', 'README.md', 'THIRD-PARTY-NOTICES.md', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "setup did not install $file" }
          }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Pandite.lnk'
          if (-not (Test-Path -LiteralPath $link)) { throw "setup did not create $link" }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($u.ExitCode -ne 0) { throw "uninstall failed with exit code $($u.ExitCode)" }
          # The uninstaller finishes in a copy of itself: wait for the files to go.
          $exe = Join-Path $dir 'pandite.exe'
          for ($i = 0; $i -lt 60 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw 'uninstall left pandite.exe behind' }
          if (Test-Path -LiteralPath $link) { throw 'uninstall left the Start menu shortcut behind' }
          Write-Output 'The setup program installed and uninstalled Pandite.'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows-bundle:
    name: Windows MSIX bundle
    needs: [version, windows]
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: packages
          merge-multiple: true

      - name: Bundle x64 and ARM64
        run: |
          node packaging/windows/build-msix.mjs --version "$VERSION" --out dist --bundle \
            "packages/pandite-$VERSION-x86_64-windows.msix" \
            "packages/pandite-$VERSION-aarch64-windows.msix"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (aarch64-apple-darwin + x86_64-apple-darwin)
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_MACOS_CERT: ${{ secrets.PANDITE_MACOS_CERT_BASE64 != '' }}
      HAS_MACOS_STORE_CERT: ${{ secrets.PANDITE_MACOS_STORE_CERT_BASE64 != '' && secrets.PANDITE_MACOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --locked -p pandite-app \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Third-party notices
        run: node packaging/third-party-notices.mjs

      - name: Developer ID certificate in a temporary keychain (only when the secret exists)
        if: env.HAS_MACOS_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.PANDITE_MACOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PANDITE_MACOS_CERT_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/pandite-developer-id.p12"
          keychain="$RUNNER_TEMP/pandite-signing.keychain-db"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$CERT_BASE64" | base64 --decode > "$cert"
          key=$(openssl rand -hex 24)
          security create-keychain -p "$key" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$key" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$key" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "the .p12 file holds no Developer ID Application identity" >&2; exit 1; }
          echo "PANDITE_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "PANDITE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Universal app in a disk image
        env:
          PANDITE_APPLE_ID: ${{ secrets.PANDITE_APPLE_ID }}
          PANDITE_APPLE_TEAM_ID: ${{ secrets.PANDITE_APPLE_TEAM_ID }}
          PANDITE_APPLE_APP_PASSWORD: ${{ secrets.PANDITE_APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build-app.sh "$VERSION" dist target

      # The same app with the App Sandbox entitlements, to try the sandbox
      # behavior on a Mac before a store submission. A workflow artifact
      # only: it is not part of the release.
      - name: Sandbox test disk image (only with the Developer ID certificate)
        if: env.HAS_MACOS_CERT == 'true'
        env:
          PANDITE_MACOS_SANDBOX_TEST: "1"
          PANDITE_APPLE_ID: ${{ secrets.PANDITE_APPLE_ID }}
          PANDITE_APPLE_TEAM_ID: ${{ secrets.PANDITE_APPLE_TEAM_ID }}
          PANDITE_APPLE_APP_PASSWORD: ${{ secrets.PANDITE_APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build-app.sh "$VERSION" dist-sandbox-test target

      # The installer package for App Store Connect. A workflow artifact
      # only: the owner uploads it, or a later step does.
      - name: Mac App Store package (only when the store secrets exist)
        if: env.HAS_MACOS_STORE_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.PANDITE_MACOS_STORE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PANDITE_MACOS_STORE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PANDITE_MACOS_PROVISIONING_PROFILE_BASE64 }}
          PANDITE_MACOS_STORE: "1"
        run: |
          cert="$RUNNER_TEMP/pandite-store.p12"
          profile="$RUNNER_TEMP/pandite.provisionprofile"
          keychain="$RUNNER_TEMP/pandite-store.keychain-db"
          trap 'rm -f "$cert" "$profile"; security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          printf '%s' "$CERT_BASE64" | base64 --decode > "$cert"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          key=$(openssl rand -hex 24)
          security create-keychain -p "$key" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$key" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$key" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v "$keychain" | sed -n 's/.*"\(\(Apple Distribution\|3rd Party Mac Developer Application\): [^"]*\)".*/\1/p' | head -n 1)
          installer=$(security find-identity -v "$keychain" | sed -n 's/.*"\(3rd Party Mac Developer Installer: [^"]*\)".*/\1/p' | head -n 1)
          [ -n "$app" ] || { echo "the store .p12 file holds no Apple Distribution identity" >&2; exit 1; }
          [ -n "$installer" ] || { echo "the store .p12 file holds no 3rd Party Mac Developer Installer identity" >&2; exit 1; }
          PANDITE_MACOS_STORE_APP_IDENTITY="$app" \
          PANDITE_MACOS_STORE_INSTALLER_IDENTITY="$installer" \
          PANDITE_MACOS_PROVISIONING_PROFILE="$profile" \
          PANDITE_MACOS_KEYCHAIN="$keychain" \
          PANDITE_MACOS_SIGN_IDENTITY="" \
            bash packaging/macos/build-app.sh "$VERSION" dist-appstore target

      - name: Remove the temporary keychain
        if: always() && env.HAS_MACOS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/pandite-signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: env.HAS_MACOS_CERT == 'true'
        with:
          name: sandbox-test-macos
          path: dist-sandbox-test/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: env.HAS_MACOS_STORE_CERT == 'true'
        with:
          name: appstore-macos
          path: dist-appstore/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (x86_64-unknown-linux-gnu)
    needs: version
    # The oldest supported image gives the oldest glibc floor (2.35).
    # Move to ubuntu-24.04 when GitHub retires ubuntu-22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            pkg-config \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols \
            libegl-dev libgl-dev libgles-dev libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev \
            desktop-file-utils

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked -p pandite-app --target x86_64-unknown-linux-gnu

      - name: Third-party notices
        run: node packaging/third-party-notices.mjs

      - name: Tarball
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash packaging/linux/build-tarball.sh "$VERSION" dist \
            target/x86_64-unknown-linux-gnu/release/pandite

      - name: Install packaging tools
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            dpkg-dev rpm lintian

      - name: Debian package (from the tarball)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash packaging/linux/build-deb.sh "$VERSION" dist \
            "dist/pandite-$VERSION-x86_64-linux.tar.gz"

      - name: RPM package (from the tarball)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash packaging/linux/build-rpm.sh "$VERSION" dist \
            "dist/pandite-$VERSION-x86_64-linux.tar.gz"

      - name: Lint the Debian package (findings do not stop the release)
        continue-on-error: true
        run: lintian --no-tag-display-limit "dist/pandite_${VERSION}_amd64.deb" || true

      - name: Install and remove the Debian package
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            "./dist/pandite_${VERSION}_amd64.deb"
          test "$(pandite --version)" = "pandite $VERSION"
          desktop-file-validate /usr/share/applications/pandite.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/pandite.png
          sudo apt-get remove -y pandite
          test ! -e /usr/bin/pandite
          test ! -e /usr/share/applications/pandite.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Checksums
    needs: [version, windows, windows-bundle, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows-*,macos,linux}"
          path: dist
          merge-multiple: true

      - name: SHA-256 of every file
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [version, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create or update the release
        run: |
          cat > notes.md <<EOF
          Which file to download:

          - Windows, to install: \`pandite-$VERSION-x86_64-windows-setup.exe\` (x64) or \`pandite-$VERSION-aarch64-windows-setup.exe\` (ARM64). It installs Pandite for your user account, without administrator rights, adds it to the Start menu and opens image files with it. The setup programs are not code-signed, so Windows SmartScreen warns when you start one: select More info, then Run anyway.
          - Windows, portable: \`pandite-$VERSION-x86_64-windows-portable.zip\` (x64) or \`pandite-$VERSION-aarch64-windows-portable.zip\` (ARM64). Extract it and run \`pandite.exe\`. Nothing is installed.
          - Windows, Microsoft Store: \`pandite-$VERSION-windows.msixbundle\` holds both architectures for Store submission. The MSIX files are unsigned and do not install by double-click.
          - macOS 11 or later: \`pandite-$VERSION-universal-macos.dmg\` (Apple Silicon and Intel).
          - Debian and Ubuntu (x64): \`pandite_${VERSION}_amd64.deb\`. Install it with \`sudo apt install ./pandite_${VERSION}_amd64.deb\`.
          - Fedora, openSUSE and other RPM systems (x64): \`pandite-$VERSION-1.x86_64.rpm\`. Install it with \`sudo dnf install ./pandite-$VERSION-1.x86_64.rpm\`.
          - Other Linux (x64): \`pandite-$VERSION-x86_64-linux.tar.gz\`. Extract it and run \`./install.sh\` to install it for your user.
          - Windows, macOS or Linux x64 with Node.js 18 or later: \`npx pandite\` installs the latest release for your user. It downloads the setup program, the macOS zip or the Linux tarball from the release page, checks it against \`SHA256SUMS.txt\` and installs it. \`npx pandite update\` installs a newer release.

          The Linux packages need glibc 2.35 or later.

          Check downloads against \`SHA256SUMS.txt\`.
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Pandite $VERSION" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi
